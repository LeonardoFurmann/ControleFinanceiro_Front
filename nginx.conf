server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # DNS interno do Docker. Com o endereço numa variável, o Nginx resolve o nome "backend"
    # a cada requisição (com cache de 10s), e não só ao iniciar: quando o container do
    # backend é recriado num deploy e muda de IP, o Nginx acompanha.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Chamadas da API vão para o backend pela rede interna; o caminho segue igual (/api/...).
    location /api/ {
        proxy_pass $backend;
        # O backend precisa saber o endereço que está no navegador para reconhecer a chamada
        # como mesma origem; sem isso, o Spring trata o POST do navegador como CORS e recusa (403).
        # Host com a porta ($http_host, não $host). E o X-Forwarded-Proto só é repassado:
        # em produção ele vem do reverse proxy que faz o HTTPS; sem proxy na frente, não vai,
        # porque um "http" explícito faria o Tomcat trocar a porta do Host pela 80.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Arquivos gerados pelo Vite têm hash no nome: mudou o conteúdo, muda o nome.
    # Por isso podem ficar em cache no navegador por um ano.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker do PWA sempre revalidado; com cache, o app não atualizaria.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # A lista de tipos do Nginx não conhece .webmanifest e entregaria o manifesto
    # como application/octet-stream; aqui ele sai com o tipo certo (e entra no gzip).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter: rotas como /dashboard não existem como arquivo, então caem no index.html
    # e o React Router decide o que mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
